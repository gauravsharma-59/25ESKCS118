    <link rel="stylesheet" href="style.css">
</head>

            </a>

                <span class="navbar-toggler-icon"></span>
            </button>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Section -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card p-4 border-0 shadow">
                        <h2 class="text-center mb-4 text-primary">Student Registration Form</h2>
                        
                        <!-- Form with ID for JavaScript validation -->
                        <form id="registerForm">
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                            </div>
                            
                            <div class="row">
                                <!-- Email -->
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                                </div>
                                <!-- Phone -->
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="phone" placeholder="10-digit number">
                                </div>
                            </div>
                            
                            <div class="row">
                                <!-- Gender -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="gender">
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <!-- Date of Birth -->
                                <div class="col-md-6 mb-3">
                                    <label for="dob" class="form-label">Date of Birth</label>
                                    <input type="date" class="form-control" id="dob">
                                </div>
                            </div>
                            
                            <!-- Course Selection -->
                            <div class="mb-3">
                                <label for="course" class="form-label">Course Selection</label>
                                <select class="form-select" id="course">
                                    <option value="btech_cse">B.Tech CSE</option>
                                    <option value="btech_aids">B.Tech AI & DS</option>
                                    <option value="mba">MBA</option>
                                    <option value="mca">MCA</option>
                                </select>
                            </div>
                            
                            <!-- Address -->
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="3" placeholder="Enter your full address"></textarea>
                            </div>
                            
                            <!-- Terms Checkbox -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">I agree to the Terms and Conditions.</label>
                            </div>
                            
                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary btn-custom w-100">Submit Registration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light py-5">

                </div>
                <div class="col-md-4 mb-4">

                    </ul>
                </div>
                <div class="col-md-4 mb-4">
                    <h5>Connect With Us</h5>
                    <div class="d-flex gap-3 social-icons">
                        <a href="https://www.facebook.com/SKITJAIP/" target="_blank" class="text-light"><i class="fab fa-facebook fa-lg"></i></a>
                        <a href="https://www.instagram.com/skitjaipurofficial/" target="_blank" class="text-light"><i class="fab fa-instagram fa-lg"></i></a>

                    </div>
                </div>
            </div>
            <div class="text-center pt-3 border-top border-secondary">
                <p class="mb-0">&copy; 2023 SKIT Student Portal. All Rights Reserved.</p>
            </div>
        </div>
    </footer>
