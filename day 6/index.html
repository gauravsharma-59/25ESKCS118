<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .product-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15) !important;
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        .price-badge {
            font-size: 1.1rem;
            font-weight: 700;
            color: #198754;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center border-bottom pb-3 mb-4 gap-3">
            <div>
                <h1 class="fw-bold text-dark mb-1"><i class="fa-solid fa-box-open text-primary me-2"></i>Live Product
                    Catalog</h1>
                <p class="text-muted mb-0">Real-time inventory and pricing details</p>
            </div>
            <div>
                <span class="fs-5 badge bg-primary px-3 py-2 rounded-pill shadow-sm">
                    Total Products: <span id="productCount">0</span>
                </span>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i
                            class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0"
                        placeholder="Search products by title...">
                </div>
            </div>
            <div class="col-md-6 d-flex justify-content-md-end">
                <div class="input-group shadow-sm style-select style-sort" style="max-width: 250px;">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-arrow-down-a-z text-muted"></i></span>
                    <select id="sortSelect" class="form-select">
                        <option value="asc">Sort: A to Z</option>
                        <option value="desc">Sort: Z to A</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="loadingState" class="text-center my-5">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted fw-semibold">Fetching catalog items...</p>
        </div>

        <div id="errorState" class="alert alert-danger d-none text-center p-5 shadow-sm rounded-3" role="alert">
            <i class="fa-solid fa-triangle-exclamation fa-3x mb-3 text-danger"></i>
            <h4 class="alert-heading fw-bold">Oops! Something went wrong</h4>
            <p id="errorMessage" class="mb-4">We couldn't retrieve the product catalog data at this time.</p>
            <button id="retryButton" class="btn btn-danger px-4 rounded-pill"><i
                    class="fa-solid fa-rotate-right me-2"></i>Retry Now</button>
        </div>

        <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 d-none">
        </div>
    </div>

    <script>
        // Config: Swapped from /users to /products 
        // New working URL (Returns real mock product data)
        const API_URL = 'https://fakestoreapi.com/products';

        // DOM Elements
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const retryButton = document.getElementById('retryButton');
        const productGrid = document.getElementById('productGrid');
        const productCount = document.getElementById('productCount');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        let localProductsArray = [];

        // Fetch from Products API
        function fetchProducts() {
            // Reset UI States
            loadingState.classList.remove('d-none');
            errorState.classList.add('d-none');
            productGrid.classList.add('d-none');

            fetch(API_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP network error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Map incoming data schema over to product UI variables
                    localProductsArray = data.map((product) => ({
                        id: product.id,
                        title: product.title,
                        // JSONPlaceholder provides fields like price, category, image, and description for products
                        price: product.price || Math.floor(Math.random() * 90) + 10, // Fallback random price if mock dataset differs
                        category: product.category || 'General',
                        image: product.image || `https://picsum.photos/400/300?random=${product.id}`,
                        description: product.description || 'No description provided.'
                    }));

                    loadingState.classList.add('d-none');
                    productGrid.classList.remove('d-none');

                    processAndRender();
                })
                .catch(error => {
                    console.error("Catalog fetch crash:", error);
                    loadingState.classList.add('d-none');
                    errorMessage.innerText = `Failed to connect: ${error.message || 'Unknown network error.'}`;
                    errorState.classList.remove('d-none');
                });
        }

        // Process UI controls & update layouts dynamically
        function processAndRender() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const sortOrder = sortSelect.value;

            // Live Search by Title
            let displayedProducts = localProductsArray.filter(product =>
                product.title.toLowerCase().includes(searchTerm)
            );

            // Alphabetical sorting
            displayedProducts.sort((a, b) => {
                return sortOrder === 'asc'
                    ? a.title.localeCompare(b.title)
                    : b.title.localeCompare(a.title);
            });

            // Update badge 
            productCount.innerText = displayedProducts.length;

            // Clear layout
            productGrid.innerHTML = '';

            if (displayedProducts.length === 0) {
                productGrid.innerHTML = `
          <div class="col-12 text-center py-5">
            <p class="text-muted fs-5"><i class="fa-regular fa-face-frown me-2"></i>No matching products found.</p>
          </div>
        `;
                return;
            }

            // Inject Product cards into Bootstrap layout 
            displayedProducts.forEach(product => {
                const productCardHTML = `
          <div class="col">
            <div class="card h-100 border-0 shadow-sm rounded-3 product-card p-3">
              <div class="card-body d-flex flex-column">
                <img src="${product.image}" alt="${product.title}" class="product-img mb-3" onerror="this.src='https://via.placeholder.com/400x300?text=Product+Image'">
                
                <span class="badge bg-secondary align-self-start mb-2 text-uppercase font-monospace small">${product.category}</span>
                <h6 class="card-title fw-bold text-dark mb-2 text-truncate w-100" title="${product.title}">${product.title}</h6>
                
                <p class="text-muted small text-start mb-3 text-truncate-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px;">
                  ${product.description}
                </p>
                
                <div class="w-100 border-top pt-3 mt-auto d-flex justify-content-between align-items-center">
                  <div class="price-badge">$${Number(product.price).toFixed(2)}</div>
                  <button class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="fa-solid fa-cart-plus me-1"></i>View</button>
                </div>
              </div>
            </div>
          </div>
        `;
                productGrid.insertAdjacentHTML('beforeend', productCardHTML);
            });
        }

        // Event Listeners
        searchInput.addEventListener('input', processAndRender);
        sortSelect.addEventListener('change', processAndRender);
        retryButton.addEventListener('click', fetchProducts);

        // Initial Execution
        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>

</html>
